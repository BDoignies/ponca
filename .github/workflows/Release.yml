on:
  push:
    tags:
      - 'v*'

name: Create Release

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    strategy:
      matrix:
        config:
          - { name: "Ubuntu",  os: ubuntu-latest, icon: "Linux" }
          - { name: "MacOS",   os: macos-latest, icon: "Apple" }
          # - { name: "Windows", os: windows-latest, icon: "Windows"}
    steps:
      - uses: actions/checkout@master
        with:
          path: src
      
      - name: CMake
        run: |
          mkdir build && cd build
          cmake ../src -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=install-${{ matrix.config.name }} -DPONCA_CONFIGURE_EXAMPLES=OFF -DPONCA_CONFIGURE_DOC=OFF -DPONCA_CONFIFURE_TESTS=OFF -DPONCA_INSTANTIATE_ALL=OFF

      - name: Build
        run: |
          cmake --build build/

      - name: Making relocatble CMake Install
        run: |
          cmake --install build/

      - name: Zipping install directory
        run: cd build/install-${{ matrix.config.name }} && zip -r ../../ponca-${{ matrix.config.name }}.zip .

      - name: Saving folders
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config.name }}
          path: ponca-${{ matrix.config.name }}.zip


  release:
    runs-on: "ubuntu-latest"
    needs: build

    steps:
      - uses: actions/checkout@master

      - name: Extract CHANGELOG info
        id: changelog
        shell: bash
        run: |
          CONTENT=$(awk '/^-+$/{count++; if(count==2) exit} count==1{lines++; if(lines>2) print}' CHANGELOG)
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Getting install folders
        uses: actions/download-artifact@v7
        with: 
          path: all

      - name: Create Release
        uses: ncipollo/release-action@v1
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.content }}
          draft: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'RC') }}
          artifacts: "all/MacOS/ponca-MacOS.zip,all/Ubuntu/ponca-Ubuntu.zip"
          allowUpdates: true # In case something went wrong :) 

